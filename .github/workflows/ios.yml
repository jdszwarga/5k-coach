# Native iPhone + Watch app (ios/). No Mac needed locally: everything builds here.
#  - push / pull request touching ios/: compile check (unsigned), ~5–10 min
#  - Run workflow (manual): build, sign and upload to TestFlight
#  - monthly: re-upload so the TestFlight build never hits its 90-day expiry
name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight
        type: boolean
        default: true
      create_signing:
        description: Create signing certificate and profiles (first run only)
        type: boolean
        default: false
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile check
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.testflight)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools and watchOS platform
        run: |
          brew install xcodegen
          xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS
      - run: xcodegen generate
      - name: Build iPhone + Watch (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project FiveKCoach.xcodeproj -scheme FiveKCoach -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -40

  testflight:
    name: TestFlight upload
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # monthly run records a commit so GitHub keeps the schedule active
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tools and watchOS platform
        run: |
          brew install xcodegen
          xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS
      - run: xcodegen generate
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bundle install
      - name: Build, sign, upload
        run: bundle exec fastlane beta
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ inputs.create_signing && 'false' || 'true' }}
      # Public repos: GitHub turns off scheduled workflows after 60 days with no activity.
      - name: Record the refresh
        if: github.event_name == 'schedule'
        run: |
          date -u +%F > LAST_REFRESH
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_REFRESH
          git commit -m "TestFlight monthly refresh build"
          git push
